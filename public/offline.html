<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1C2920" />
    <title>Offline · RemedyAfrica</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f7f3ea;
        color: #1a221c;
        font-family: Georgia, "Times New Roman", serif;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      p.eyebrow {
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-size: 0.7rem;
        color: #a68446;
        font-family: system-ui, sans-serif;
      }
      h1 {
        font-size: 2rem;
        font-weight: 500;
        color: #1c2920;
        margin: 12px 0 16px;
      }
      p.body {
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        color: #5c675f;
      }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        background: #1c2920;
        color: #f7f3ea;
        font: 500 0.9rem system-ui, sans-serif;
        padding: 12px 22px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">The compound</p>
      <h1>You are offline.</h1>
      <p class="body">
        Identify, the library, and consultations need a connection. Reconnect, then try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
